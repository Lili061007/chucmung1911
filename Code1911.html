<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng 19/11 - Các Nam Nhân Nhà Gà</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Be Vietnam Pro"', 'sans-serif'],
                        display: ['"Quicksand"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(ellipse at bottom, #0f172a 0%, #050811 100%);
            overflow: hidden;
            user-select: none;
        }
        #starfield {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .fly-letter {
            display: inline-block;
            opacity: 0;
            transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.3);
            filter: blur(8px);
            transition: transform 4.5s cubic-bezier(0.16, 1, 0.3, 1),
                        opacity 3.5s ease-out,
                        filter 4s ease-out;
        }
        .fly-letter.assembled {
            opacity: 1;
            transform: translate(0, 0) rotate(0deg) scale(1);
            filter: blur(0px);
        }
        .glow-text {
            text-shadow: 0 0 18px rgba(253, 224, 71, 0.55), 0 0 36px rgba(56, 189, 248, 0.35);
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.75), 0 0 40px rgba(56, 189, 248, 0.12);
        }
        .cursor-blink {
            display: inline-block;
            width: 2.5px;
            height: 1.15em;
            background-color: #fde047;
            margin-left: 3px;
            vertical-align: text-bottom;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen w-screen relative flex items-center justify-center text-white">

    <!-- Bầu trời sao nhấp nháy -->
    <canvas id="starfield"></canvas>

    <!-- MÀN 1: INTRO GHÉP CHỮ 10 GIÂY -->
    <div id="intro-scene" class="relative z-10 flex flex-col items-center justify-center px-6 text-center transition-all duration-1000">
        <div id="assembled-sentence" class="font-display text-2xl sm:text-4xl md:text-5xl font-bold tracking-wide text-amber-200 glow-text leading-relaxed max-w-4xl"></div>
        <div class="mt-8 w-48 sm:w-64 h-1 bg-white/10 rounded-full overflow-hidden">
            <div id="intro-progress" class="h-full bg-gradient-to-r from-sky-400 via-amber-300 to-yellow-200 w-0 rounded-full"></div>
        </div>
    </div>

    <!-- MÀN 2: KHUNG THIỆP CHÍNH -->
    <div id="main-scene" class="relative z-10 w-full max-w-2xl px-4 sm:px-6 opacity-0 scale-95 pointer-events-none transition-all duration-1000 hidden">
        <div class="glass-card rounded-3xl p-7 sm:p-11 relative overflow-hidden">
            <div class="text-center mb-6">
                <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-amber-400/10 border border-amber-300/25 text-amber-300 text-xs font-semibold tracking-widest uppercase mb-4">
                    <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                    <span>19 • 11</span>
                    <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                </div>
                <h1 class="font-display text-2xl sm:text-4xl font-bold bg-gradient-to-r from-amber-200 via-yellow-100 to-sky-200 bg-clip-text text-transparent">
                    Happy International Men's Day 19/11
                </h1>
                <p class="mt-2.5 text-base sm:text-lg font-medium text-sky-300/90">
                    Gửi đến các nam nhân nhà Gà
                </p>
            </div>

            <div class="h-px w-full bg-gradient-to-r from-transparent via-white/20 to-transparent my-6"></div>

            <!-- Nội dung gõ máy chữ -->
            <div class="min-h-[190px] sm:min-h-[175px] flex items-start">
                <p class="text-slate-100 text-base sm:text-lg leading-relaxed whitespace-pre-line font-normal">
                    <span id="typewriter-text"></span><span id="cursor" class="cursor-blink"></span>
                </p>
            </div>

            <!-- Nút xem lại -->
            <div class="mt-8 pt-4 border-t border-white/10 flex justify-end">
                <button id="replay-btn" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 text-xs sm:text-sm text-slate-300 hover:text-white transition cursor-pointer">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    <span>Xem lại từ đầu</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // 1. HIỆU ỨNG BẦU TRỜI SAO NHẤP NHÁY
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let shootingStars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            const count = Math.floor((canvas.width * canvas.height) / 4500);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.7 + 0.4,
                    alpha: Math.random(),
                    speed: (Math.random() * 0.02 + 0.005) * (Math.random() < 0.5 ? 1 : -1),
                    color: Math.random() > 0.8 ? '#fde68a' : (Math.random() > 0.5 ? '#bae6fd' : '#ffffff')
                });
            }
        }

        function spawnShootingStar() {
            if (Math.random() < 0.015 && shootingStars.length < 2) {
                shootingStars.push({
                    x: Math.random() * canvas.width * 0.8,
                    y: Math.random() * canvas.height * 0.4,
                    len: Math.random() * 80 + 50,
                    speed: Math.random() * 8 + 6,
                    alpha: 1
                });
            }
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const s of stars) {
                s.alpha += s.speed;
                if (s.alpha >= 1) { s.alpha = 1; s.speed = -Math.abs(s.speed); }
                if (s.alpha <= 0.15) { s.alpha = 0.15; s.speed = Math.abs(s.speed); }

                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = s.color;
                ctx.globalAlpha = s.alpha;
                ctx.fill();
            }

            spawnShootingStar();
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const ss = shootingStars[i];
                ctx.save();
                ctx.globalAlpha = ss.alpha;
                const grad = ctx.createLinearGradient(ss.x, ss.y, ss.x - ss.len, ss.y - ss.len * 0.5);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(1, 'transparent');
                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(ss.x, ss.y);
                ctx.lineTo(ss.x - ss.len, ss.y - ss.len * 0.5);
                ctx.stroke();
                ctx.restore();

                ss.x += ss.speed;
                ss.y += ss.speed * 0.5;
                ss.alpha -= 0.018;
                if (ss.alpha <= 0) shootingStars.splice(i, 1);
            }
            ctx.globalAlpha = 1;
            requestAnimationFrame(animateStars);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        animateStars();

        // 2. KỊCH BẢN INTRO 10S & CHUYỂN CẢNH GÕ MÁY CHỮ
        const introScene = document.getElementById('intro-scene');
        const assembledSentence = document.getElementById('assembled-sentence');
        const introProgress = document.getElementById('intro-progress');
        const mainScene = document.getElementById('main-scene');
        const typewriterText = document.getElementById('typewriter-text');
        const replayBtn = document.getElementById('replay-btn');

        const introPhrase = "Chúc mừng 19/11 các nam nhân nhà Gà";
        const wishMessage = `Nhân ngày Quốc tế Nam giới 19/11, xin gửi lời chúc tốt đẹp và chân thành nhất đến toàn thể các nam nhân nhà Gà!

Chúc các nam nhân luôn giữ vững phong độ đỉnh cao, sức khỏe bền bỉ, tinh thần phơi phới và tràn đầy năng lượng.

Chúc cho công việc và học tập luôn rộng mở, bứt phá mọi mục tiêu, ví tiền lúc nào cũng đầy ắp. Cuối cùng, cảm ơn các nam nhân đã luôn hết mình, nhiệt tình và luôn đem lại những tiếng cười rộn rã cho đại gia đình nhà Gà!`;

        let introTimer = null;
        let typingTimer = null;

        function buildIntroLetters() {
            assembledSentence.innerHTML = '';
            const words = introPhrase.split(' ');
            words.forEach((word, wIdx) => {
                const wordSpan = document.createElement('span');
                wordSpan.className = 'inline-block whitespace-nowrap';
                for (const char of word) {
                    const span = document.createElement('span');
                    span.textContent = char;
                    span.className = 'fly-letter';
                    const tx = (Math.random() - 0.5) * window.innerWidth * 0.9;
                    const ty = (Math.random() - 0.5) * window.innerHeight * 0.9;
                    const rot = (Math.random() - 0.5) * 360;
                    span.style.setProperty('--tx', `${tx}px`);
                    span.style.setProperty('--ty', `${ty}px`);
                    span.style.setProperty('--rot', `${rot}deg`);
                    wordSpan.appendChild(span);
                }
                assembledSentence.appendChild(wordSpan);
                if (wIdx < words.length - 1) {
                    assembledSentence.appendChild(document.createTextNode(' '));
                }
            });
        }

        function startTypewriter(text) {
            clearInterval(typingTimer);
            typewriterText.textContent = '';
            let index = 0;
            typingTimer = setInterval(() => {
                if (index < text.length) {
                    typewriterText.textContent += text.charAt(index);
                    index++;
                } else {
                    clearInterval(typingTimer);
                }
            }, 35);
        }

        function startExperience() {
            clearTimeout(introTimer);
            clearInterval(typingTimer);

            mainScene.classList.add('opacity-0', 'scale-95', 'pointer-events-none', 'hidden');
            introScene.classList.remove('hidden', 'opacity-0', 'scale-105');

            introProgress.style.transition = 'none';
            introProgress.style.width = '0%';

            buildIntroLetters();

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    document.querySelectorAll('.fly-letter').forEach((el, idx) => {
                        el.style.transitionDelay = `${idx * 45}ms`;
                        el.classList.add('assembled');
                    });
                    introProgress.style.transition = 'width 10s linear';
                    introProgress.style.width = '100%';
                });
            });

            introTimer = setTimeout(() => {
                introScene.classList.add('opacity-0', 'scale-105');
                setTimeout(() => {
                    introScene.classList.add('hidden');
                    mainScene.classList.remove('hidden');
                    requestAnimationFrame(() => {
                        mainScene.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
                        startTypewriter(wishMessage);
                    });
                }, 900);
            }, 10000);
        }

        replayBtn.addEventListener('click', startExperience);
        startExperience();
    </script>
</body>
</html>
